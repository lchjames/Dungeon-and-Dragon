name: Production Alpha Live Playtest

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Optional alpha-e2e run identifier
        required: false
        type: string
      max_attack_attempts:
        description: Maximum Player attacks per hostile target
        required: false
        default: '8'
        type: string

permissions:
  contents: read

jobs:
  live-alpha:
    name: Run production Alpha E2E
    runs-on: ubuntu-latest
    concurrency:
      group: dnd-production-alpha-live
      cancel-in-progress: false
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate live-playtest credential
        shell: bash
        env:
          DND_ALPHA_GM_PASSWORD: ${{ secrets.DND_ALPHA_GM_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$DND_ALPHA_GM_PASSWORD" ]]; then
            echo "Repository secret DND_ALPHA_GM_PASSWORD is not configured."
            exit 1
          fi
          actual_hash="$(printf '%s' "$DND_ALPHA_GM_PASSWORD" | sha256sum | awk '{print $1}')"
          expected_hash="5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8"
          if [[ "$actual_hash" != "$expected_hash" ]]; then
            echo "Repository secret DND_ALPHA_GM_PASSWORD does not match the configured Alpha GM credential. Re-save the secret as the exact value configured for gm."
            exit 1
          fi

      - name: Show tested revision
        shell: bash
        run: |
          git log -1 --format='Live playtest revision: %H %s'

      - name: Clean guarded stale Alpha Combat
        env:
          DND_ALPHA_BASE_URL: https://dnd.apswsttss.workers.dev
          DND_ALPHA_GM_USERNAME: gm
          DND_ALPHA_GM_PASSWORD: ${{ secrets.DND_ALPHA_GM_PASSWORD }}
        run: node scripts/cleanup-stale-alpha-combat.mjs

      - name: Run production Alpha E2E suite
        env:
          DND_ALPHA_EXECUTE: '1'
          DND_ALPHA_BASE_URL: https://dnd.apswsttss.workers.dev
          DND_ALPHA_GM_USERNAME: gm
          DND_ALPHA_GM_PASSWORD: ${{ secrets.DND_ALPHA_GM_PASSWORD }}
          DND_ALPHA_RUN_ID: ${{ inputs.run_id }}
          DND_ALPHA_MAX_ATTACK_ATTEMPTS: ${{ inputs.max_attack_attempts }}
        run: node scripts/production-alpha-e2e.mjs
