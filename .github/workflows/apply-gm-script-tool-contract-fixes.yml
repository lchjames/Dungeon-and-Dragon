name: Apply GM Story Script Tool Contract Fixes

on:
  push:
    branches:
      - feature/gm-script-tool-alpha

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gm-script-tool-alpha
      - name: Apply deterministic contract fixes
        run: python3 scripts/apply-gm-script-tool-contract-fixes.py
      - name: Validate Story Script and affected contracts
        run: |
          git diff --check
          node --check src/story-script-gateway.js
          node tests/story-script-compiler.test.mjs
          node tests/story-combat-ended-trigger-contract.test.mjs
          node tests/story-encounter-resolved-trigger-contract.test.mjs
          node tests/story-flag-changed-trigger-contract.test.mjs
          node tests/story-interact-object-trigger-contract.test.mjs
          node tests/story-object-state-mechanics-contract.test.mjs
          node tests/story-script-tool-contract.test.mjs
          node tests/deployment-contract.test.mjs
      - name: Commit generated fixes
        run: |
          if git diff --quiet -- src/story-script-gateway.js tests; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/story-script-gateway.js tests
          git commit -m "Align Story Script entry-point contracts"
          git push origin HEAD:feature/gm-script-tool-alpha
