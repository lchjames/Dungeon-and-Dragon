name: Cleanup Story Object State Integration

on:
  push:
    branches:
      - feature/story-object-state-mechanics
    paths:
      - .github/workflows/cleanup-story-object-state.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/story-object-state-mechanics

      - name: Restore Encounter authoring help
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; p=Path('public/assets/gm-story-events.js'); s=p.read_text(); old='Map targets use stable Template <code>sourceEdgeId</code> / <code>sourceZoneId</code> / <code>sourceObjectId</code>. Object conditions use <code>{type: object_state, sourceObjectId, stateKey}</code>; effects use <code>{type: set_object_state, sourceObjectId, stateKey}</code>. Runtime state stays isolated per Scene Run.'; new='Map targets use stable Template <code>sourceEdgeId</code> / <code>sourceZoneId</code> / <code>sourceObjectId</code>. Encounter effects use the Encounter Definition <code>encounterId</code>. Object conditions use <code>{type: object_state, sourceObjectId, stateKey}</code>; effects use <code>{type: set_object_state, sourceObjectId, stateKey}</code>. Runtime state stays isolated per Scene Run.'; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))"
          node --check public/assets/gm-story-events.js
          node tests/runtime-encounter-state-contract.test.mjs
          node tests/story-object-state-mechanics-contract.test.mjs
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/gm-story-events.js
          git commit -m "Restore Encounter Story authoring help"
          git push origin HEAD:feature/story-object-state-mechanics
