name: Apply GM Story Script Tool Finalize

on:
  push:
    branches:
      - feature/gm-script-tool-alpha

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gm-script-tool-alpha
      - name: Apply deterministic finalize patch
        run: python3 scripts/apply-gm-story-script-tool-finalize.py
      - name: Validate generated files
        run: |
          git diff --check
          node --check public/assets/gm-story-script-tool.js
          node --check src/story-script-compiler.js
          node --check src/story-script-gateway.js
          node tests/story-script-compiler.test.mjs
      - name: Commit generated finalize patch
        run: |
          if git diff --quiet -- public/gm/index.html tests/deployment-contract.test.mjs; then
            echo "No finalize changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/gm/index.html tests/deployment-contract.test.mjs
          git commit -m "Finalize GM Story Script Tool integration"
          git push origin HEAD:feature/gm-script-tool-alpha
