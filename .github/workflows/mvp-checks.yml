name: MVP checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in src/*.js public/assets/*.js; do
            node --check "$file"
          done

      - name: Rules regression tests
        run: |
          node tests/rules.test.mjs
          node tests/combat-rules.test.mjs
          node tests/monster-rules.test.mjs
          node tests/monster-life.test.mjs
          node tests/boss-rules.test.mjs
          node tests/boss-life.test.mjs

      - name: Static / deployment contract tests
        run: |
          node tests/static-ui-contract.test.mjs
          node tests/boss-defeat-contract.test.mjs
          node tests/deployment-contract.test.mjs

      - name: Scenario end-to-end regression
        run: node tests/mvp-scenario-e2e.test.mjs

  deploy-production:
    name: Deploy Cloudflare production
    needs: node-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Cloudflare deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Smoke test production routes
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://dungeon-and-dragon.lchjames.com"

          request() {
            local path="$1"
            local header_file="$2"
            local body_file="$3"
            curl \
              --silent \
              --show-error \
              --retry 8 \
              --retry-all-errors \
              --retry-delay 2 \
              --connect-timeout 10 \
              --max-time 30 \
              --output "$body_file" \
              --dump-header "$header_file" \
              --write-out '%{http_code}' \
              "$BASE_URL$path"
          }

          expect_2xx() {
            local path="$1"
            local status
            status="$(request "$path" /tmp/headers /tmp/body)"
            if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
              echo "Expected 2xx for $path, got $status"
              cat /tmp/headers || true
              head -c 1000 /tmp/body || true
              exit 1
            fi
          }

          expect_redirect_to_login() {
            local path="$1"
            local status location
            status="$(request "$path" /tmp/headers /tmp/body)"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, "", $0); sub(/^[^:]+:[[:space:]]*/, "", $0); print; exit}' /tmp/headers)"
            if [[ "$status" != "302" || "$location" != *"/player/login/"* ]]; then
              echo "Expected 302 login redirect for $path, got status=$status location=$location"
              cat /tmp/headers || true
              exit 1
            fi
          }

          expect_2xx "/"
          expect_2xx "/player/login/"
          expect_redirect_to_login "/player/"
          expect_redirect_to_login "/gm/"

          auth_status="$(request "/api/auth/me" /tmp/headers /tmp/body)"
          if [[ "$auth_status" != "401" ]]; then
            echo "Expected unauthenticated /api/auth/me to return 401, got $auth_status"
            cat /tmp/headers || true
            head -c 1000 /tmp/body || true
            exit 1
          fi
