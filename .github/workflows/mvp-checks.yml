name: MVP checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in src/*.js public/assets/*.js; do
            node --check "$file"
          done

      - name: Rules regression tests
        run: |
          node tests/rules.test.mjs
          node tests/combat-rules.test.mjs
          node tests/monster-rules.test.mjs
          node tests/monster-life.test.mjs
          node tests/boss-rules.test.mjs
          node tests/boss-life.test.mjs

      - name: Static UI contract tests
        run: |
          node tests/static-ui-contract.test.mjs
          node tests/boss-defeat-contract.test.mjs

      - name: Scenario end-to-end regression
        run: node tests/mvp-scenario-e2e.test.mjs

  deploy-production:
    name: Deploy Cloudflare production
    needs: node-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Cloudflare deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
