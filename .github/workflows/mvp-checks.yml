name: MVP checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in src/*.js public/assets/*.js scripts/*.mjs; do
            node --check "$file"
          done

      - name: Validate production Alpha runner safety gate
        run: node scripts/production-alpha-e2e.mjs

      - name: Rules regression tests
        run: |
          node tests/rules.test.mjs
          node tests/rest-rules.test.mjs
          node tests/runtime-token-visibility.test.mjs
          node tests/story-event-rules.test.mjs
          node tests/combat-rules.test.mjs
          node tests/monster-rules.test.mjs
          node tests/monster-life.test.mjs
          node tests/boss-rules.test.mjs
          node tests/boss-life.test.mjs

      - name: Static / deployment contract tests
        run: |
          node tests/static-ui-contract.test.mjs
          node tests/player-focus-contract.test.mjs
          node tests/player-rest-contract.test.mjs
          node tests/boss-defeat-contract.test.mjs
          node tests/admin-auth-contract.test.mjs
          node tests/deployment-contract.test.mjs
          node tests/world-map-foundation.test.mjs
          node tests/world-map-grid-editor.test.mjs
          node tests/runtime-map-position.test.mjs
          node tests/runtime-token-visibility-contract.test.mjs
          node tests/story-event-runtime-contract.test.mjs
          node tests/story-enter-zone-trigger-contract.test.mjs
          node tests/story-runtime-spawn-combat-effects-contract.test.mjs
          node tests/runtime-encounter-state-contract.test.mjs
          node tests/runtime-encounter-spawn-combat-contract.test.mjs
          node tests/player-map-movement.test.mjs
          node tests/runtime-door-control.test.mjs
          node tests/hostile-combat-movement.test.mjs
          node tests/gm-combat-map-context.test.mjs
          node tests/gm-auth-redirect-contract.test.mjs

      - name: Scenario end-to-end regression
        run: node tests/mvp-scenario-e2e.test.mjs

  deploy-production:
    name: Deploy Cloudflare production
    needs: node-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Cloudflare deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Smoke test production routes
        shell: bash
        run: |
          set -euo pipefail
          CUSTOM_DOMAIN="https://dungeon-and-dragon.lchjames.com"
          WORKER_BASE="https://dnd.apswsttss.workers.dev"

          request_url() {
            local url="$1"
            local header_file="$2"
            local body_file="$3"
            curl \
              --silent \
              --show-error \
              --retry 8 \
              --retry-all-errors \
              --retry-delay 2 \
              --connect-timeout 10 \
              --max-time 30 \
              --output "$body_file" \
              --dump-header "$header_file" \
              --write-out '%{http_code}' \
              "$url"
          }

          request_worker() {
            local path="$1"
            request_url "$WORKER_BASE$path" /tmp/headers /tmp/body
          }

          edge_status="$(request_url "$CUSTOM_DOMAIN/" /tmp/edge-headers /tmp/edge-body)"
          edge_mitigation="$(awk 'BEGIN{IGNORECASE=1} /^cf-mitigated:/ {sub(/\r$/, "", $0); sub(/^[^:]+:[[:space:]]*/, "", $0); print; exit}' /tmp/edge-headers)"
          if [[ ! "$edge_status" =~ ^[23][0-9][0-9]$ && !( "$edge_status" == "403" && "$edge_mitigation" == "challenge" ) ]]; then
            echo "Custom domain edge check failed: status=$edge_status cf-mitigated=$edge_mitigation"
            cat /tmp/edge-headers || true
            head -c 1000 /tmp/edge-body || true
            exit 1
          fi

          expect_2xx() {
            local path="$1"
            local status
            status="$(request_worker "$path")"
            if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
              echo "Expected 2xx for workers.dev $path, got $status"
              cat /tmp/headers || true
              head -c 1000 /tmp/body || true
              exit 1
            fi
          }

          expect_redirect() {
            local path="$1"
            local target="$2"
            local status location
            status="$(request_worker "$path")"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, "", $0); sub(/^[^:]+:[[:space:]]*/, "", $0); print; exit}' /tmp/headers)"
            if [[ "$status" != "302" || "$location" != *"$target"* ]]; then
              echo "Expected 302 redirect for workers.dev $path to $target, got status=$status location=$location"
              cat /tmp/headers || true
              exit 1
            fi
          }

          expect_2xx "/"
          expect_2xx "/player/login/"
          expect_2xx "/gm/login/"
          expect_redirect "/player/" "/player/login/"
          expect_redirect "/gm/" "/gm/login/"

          player_auth_status="$(request_worker "/api/auth/me")"
          if [[ "$player_auth_status" != "401" ]]; then
            echo "Expected unauthenticated workers.dev /api/auth/me to return 401, got $player_auth_status"
            exit 1
          fi

          admin_auth_status="$(request_worker "/api/admin/auth/me")"
          if [[ "$admin_auth_status" != "401" ]]; then
            echo "Expected unauthenticated workers.dev /api/admin/auth/me to return 401, got $admin_auth_status"
            exit 1
          fi
