name: Fix Story Object State Manual Integration

on:
  push:
    branches:
      - feature/story-object-state-mechanics
    paths:
      - .github/workflows/fix-story-object-state-manual.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/story-object-state-mechanics

      - name: Repair manual Object-state validation and contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gateway_path = Path('src/story-event-gateway.js')
          gateway = gateway_path.read_text(encoding='utf-8')

          insertion_point = """    if ((effect.type === 'open_door' || effect.type === 'close_door') && !targets.doorBySource.has(effect.sourceEdgeId)) {
              throw Object.assign(new Error(`Runtime Door source target not found: ${effect.sourceEdgeId}`), {
                status: 409, code: 'STORY_EFFECT_DOOR_NOT_FOUND'
              });
            }
          }
          return targets;
          }""".replace('            ', '    ', 1)
          # Use the exact source spelling rather than relying on YAML visual indentation.
          insertion_point = """    if ((effect.type === 'open_door' || effect.type === 'close_door') && !targets.doorBySource.has(effect.sourceEdgeId)) {
              throw Object.assign(new Error(`Runtime Door source target not found: ${effect.sourceEdgeId}`), {
                status: 409, code: 'STORY_EFFECT_DOOR_NOT_FOUND'
              });
            }
          }
          return targets;
          }"""
          insertion_point = '\n'.join(line[8:] if line.startswith('        ') else line for line in insertion_point.splitlines())
          replacement = """    if ((effect.type === 'open_door' || effect.type === 'close_door') && !targets.doorBySource.has(effect.sourceEdgeId)) {
              throw Object.assign(new Error(`Runtime Door source target not found: ${effect.sourceEdgeId}`), {
                status: 409, code: 'STORY_EFFECT_DOOR_NOT_FOUND'
              });
            }
            if (effect.type === 'set_object_state' && !targets.objectBySource?.has(effect.sourceObjectId)) {
              throw Object.assign(new Error(`Runtime Object target not found: ${effect.sourceObjectId}`), {
                status: 409, code: 'STORY_EFFECT_OBJECT_NOT_FOUND'
              });
            }
          }
          return targets;
          }"""
          replacement = '\n'.join(line[8:] if line.startswith('        ') else line for line in replacement.splitlines())
          if gateway.count(insertion_point) != 1:
              raise SystemExit(f'Expected one validateTargets insertion point, found {gateway.count(insertion_point)}')
          gateway = gateway.replace(insertion_point, replacement, 1)

          orphan = """    if (effect.type === 'set_object_state' && !targets.objectBySource?.has(effect.sourceObjectId)) {
              throw Object.assign(new Error(`Runtime Object target not found: ${effect.sourceObjectId}`), {
                code: 'STORY_EFFECT_OBJECT_NOT_FOUND'
              });
            }
          """
          orphan = '\n'.join(line[4:] if line.startswith('    ') else line for line in orphan.splitlines())
          # Scope the removal to the tail after the gateway catch; this block is unreachable there.
          marker = "      return apiError('Story Event runtime service 暫時無法使用。', 500, 'STORY_EVENT_SERVICE_ERROR');\n    }\n"
          marker_index = gateway.find(marker)
          if marker_index < 0:
              raise SystemExit('Gateway catch marker not found')
          tail = gateway[marker_index + len(marker):]
          if tail.count(orphan) != 1:
              raise SystemExit(f'Expected one orphan Object validation block in gateway tail, found {tail.count(orphan)}')
          tail = tail.replace(orphan, '', 1)
          gateway = gateway[:marker_index + len(marker)] + tail
          gateway_path.write_text(gateway, encoding='utf-8')

          contract_path = Path('tests/story-object-state-mechanics-contract.test.mjs')
          contract = contract_path.read_text(encoding='utf-8')
          old_assert = "assert.match(source, /objects:/, `${label} must pass Object states into condition evaluation.`);"
          new_assert = "assert.match(source, /objects(?:\\s*:|\\s*,)/, `${label} must pass Object states into condition evaluation.`);"
          if contract.count(old_assert) != 1:
              raise SystemExit(f'Expected one Object condition-context assertion, found {contract.count(old_assert)}')
          contract = contract.replace(old_assert, new_assert, 1)
          contract_path.write_text(contract, encoding='utf-8')
          PY

      - name: Validate repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check src/story-event-gateway.js
          node tests/story-object-state-mechanics-contract.test.mjs

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/story-event-gateway.js tests/story-object-state-mechanics-contract.test.mjs
          git commit -m "Fix manual Story Object state integration"
          git push origin HEAD:feature/story-object-state-mechanics
