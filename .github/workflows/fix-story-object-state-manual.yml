name: Fix Story Object State Manual Integration

on:
  push:
    branches:
      - feature/story-object-state-mechanics
    paths:
      - .github/workflows/fix-story-object-state-manual.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/story-object-state-mechanics

      - name: Repair manual Object-state validation and contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          gateway_path = Path('src/story-event-gateway.js')
          gateway = gateway_path.read_text(encoding='utf-8')

          start = gateway.index('function validateTargets(')
          end = gateway.index('\nasync function applyDoorEffect', start)
          section = gateway[start:end]
          loop_end = section.rfind('  }\n  return targets;\n}')
          if loop_end < 0:
              raise SystemExit('validateTargets effect-loop boundary not found')
          if "effect.type === 'set_object_state'" in section:
              raise SystemExit('validateTargets already contains set_object_state validation unexpectedly')
          validation = """    if (effect.type === 'set_object_state' && !targets.objectBySource?.has(effect.sourceObjectId)) {
              throw Object.assign(new Error(`Runtime Object target not found: ${effect.sourceObjectId}`), {
                status: 409, code: 'STORY_EFFECT_OBJECT_NOT_FOUND'
              });
            }
          """
          validation = '\n'.join(line[8:] if line.startswith('        ') else line for line in validation.splitlines()) + '\n'
          section = section[:loop_end] + validation + section[loop_end:]
          gateway = gateway[:start] + section + gateway[end:]

          catch_marker = "return apiError('Story Event runtime service 暫時無法使用。', 500, 'STORY_EVENT_SERVICE_ERROR');"
          tail_start = gateway.index(catch_marker)
          head, tail = gateway[:tail_start], gateway[tail_start:]
          orphan_pattern = re.compile(
              r"\n    if \(effect\.type === 'set_object_state' && !targets\.objectBySource\?\.has\(effect\.sourceObjectId\)\) \{\n"
              r"      throw Object\.assign\(new Error\(`Runtime Object target not found: \$\{effect\.sourceObjectId\}`\), \{\n"
              r"        code: 'STORY_EFFECT_OBJECT_NOT_FOUND'\n"
              r"      \}\);\n"
              r"    \}\n"
          )
          tail, removed = orphan_pattern.subn('\n', tail, count=1)
          if removed != 1:
              raise SystemExit(f'Expected one unreachable Object validation block in gateway tail, removed {removed}')
          gateway = head + tail
          gateway_path.write_text(gateway, encoding='utf-8')

          contract_path = Path('tests/story-object-state-mechanics-contract.test.mjs')
          contract = contract_path.read_text(encoding='utf-8')
          old_assert = "assert.match(source, /objects:/, `${label} must pass Object states into condition evaluation.`);"
          new_assert = "assert.match(source, /objects(?:\\s*:|\\s*,)/, `${label} must pass Object states into condition evaluation.`);"
          if contract.count(old_assert) != 1:
              raise SystemExit(f'Expected one Object condition-context assertion, found {contract.count(old_assert)}')
          contract = contract.replace(old_assert, new_assert, 1)
          contract_path.write_text(contract, encoding='utf-8')
          PY

      - name: Validate repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check src/story-event-gateway.js
          node tests/story-object-state-mechanics-contract.test.mjs

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/story-event-gateway.js tests/story-object-state-mechanics-contract.test.mjs
          git commit -m "Fix manual Story Object state integration"
          git push origin HEAD:feature/story-object-state-mechanics
