name: Patch Story Shared Execution Authority Final Fixes

on:
  push:
    branches:
      - feature/story-shared-execution-authority
    paths:
      - .github/workflows/patch-story-shared-execution-authority.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/story-shared-execution-authority

      - name: Apply final Story authority fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          authority_path = Path('src/story-execution-authority.js')
          authority = authority_path.read_text()
          marker = "\nexport async function executeRuntimeStoryEvent(env, {\n"
          assert authority.count(marker) == 1
          helper = r'''
export async function failRuntimeStoryEvent(env, {
  shared,
  event,
  error,
  effectsApplied = []
}) {
  if (!shared?.actor?.id || !shared.sceneRunId || !shared.sceneId || !shared.mapInstanceId) {
    throw Object.assign(new Error('Story execution context is incomplete.'), {
      status: 500,
      code: 'STORY_EXECUTION_CONTEXT_INVALID'
    });
  }
  await ensureStoryExecutionAuthoritySchema(env);
  const executionId = await recordExecution(
    env,
    { ...shared, event },
    'failed',
    effectsApplied,
    error
  ).catch(() => null);
  return {
    eventId: event.id,
    name: event.name,
    status: 'failed',
    executionId,
    effectsApplied,
    ...cleanError(error)
  };
}
'''
          authority = authority.replace(marker, '\n' + helper + marker.lstrip('\n'), 1)
          authority_path.write_text(authority)

          scene_path = Path('src/scene-run-start-story.js')
          scene = scene_path.read_text()
          old_import = "import { executeRuntimeStoryEvent } from './story-execution-authority.js';"
          new_import = "import {\n  executeRuntimeStoryEvent,\n  failRuntimeStoryEvent\n} from './story-execution-authority.js';"
          assert scene.count(old_import) == 1
          scene = scene.replace(old_import, new_import, 1)
          old_loop = '''    const event = eventPayload(row);
    const firedCount = counts.get(event.id) || 0;
    const result = await executeRuntimeStoryEvent(env, { shared, event, firedCount });
    if (result.status === 'applied') counts.set(event.id, firedCount + 1);
    results.push(result);'''
          new_loop = '''    const event = eventPayload(row);
    const firedCount = counts.get(event.id) || 0;
    let triggerError = null;
    if (!(event.oncePerSceneRun && firedCount > 0)) {
      try {
        normalizeStoryTrigger('scene_run_start', event.trigger);
      } catch (error) {
        triggerError = error;
      }
    }
    const result = triggerError
      ? await failRuntimeStoryEvent(env, { shared, event, error: triggerError })
      : await executeRuntimeStoryEvent(env, { shared, event, firedCount });
    if (result.status === 'applied') counts.set(event.id, firedCount + 1);
    results.push(result);'''
          assert scene.count(old_loop) == 1
          scene = scene.replace(old_loop, new_loop, 1)
          scene_path.write_text(scene)

          contract_path = Path('tests/story-enter-zone-trigger-contract.test.mjs')
          contract = contract_path.read_text()
          contract = contract.replace(
            "const gateway = await readFile(new URL('../src/story-zone-trigger-gateway.js', import.meta.url), 'utf8');\n",
            "const gateway = await readFile(new URL('../src/story-zone-trigger-gateway.js', import.meta.url), 'utf8');\nconst authority = await readFile(new URL('../src/story-execution-authority.js', import.meta.url), 'utf8');\n",
            1
          )
          contract = contract.replace(
            "assert.match(gateway, /import \\{ evaluateStoryConditions, normalizeStoryTrigger \\} from '\\.\\/story-event-rules\\.js'/);",
            "assert.match(gateway, /import \\{ normalizeStoryTrigger \\} from '\\.\\/story-event-rules\\.js'/);\nassert.match(gateway, /story-execution-authority\\.js/);\nassert.match(gateway, /executeRuntimeStoryEvent\\(env, \\{ shared, event, firedCount \\}\\)/);",
            1
          )
          for stale in [
            "assert.match(gateway, /STORY_EVENT_ALREADY_FIRED/);\n",
            "assert.match(gateway, /STORY_EVENT_CONDITIONS_NOT_MET/);\n",
            "assert.match(gateway, /runtime_door_state_log/);\n",
            "assert.match(gateway, /updated_by_user_id/);\n",
            "assert.match(gateway, /activated_by_user_id/);\n",
          ]:
            assert stale in contract, stale
            contract = contract.replace(stale, '', 1)
          anchor = "assert.match(gateway, /runtime_story_event_executions/);\n"
          assert anchor in contract
          contract = contract.replace(
            anchor,
            anchor + "assert.match(gateway, /async function loadFlags/);\nassert.match(gateway, /async function appliedCounts/);\n",
            1
          )
          safety_anchor = "assert.doesNotMatch(gateway, /new Function\\s*\\(/);\n"
          assert safety_anchor in contract
          contract = contract.replace(
            safety_anchor,
            safety_anchor + "assert.doesNotMatch(gateway, /async function applyEffect\\(/);\nassert.doesNotMatch(gateway, /from '\\.\\/runtime-encounter-service\\.js'/);\n\nassert.match(authority, /STORY_EVENT_ALREADY_FIRED/);\nassert.match(authority, /STORY_EVENT_CONDITIONS_NOT_MET/);\nassert.match(authority, /runtime_door_state_log/);\n",
            1
          )
          contract_path.write_text(contract)
          PY

      - name: Validate final fixes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check src/story-execution-authority.js
          node --check src/scene-run-start-story.js
          node --check src/story-zone-trigger-gateway.js
          node tests/story-shared-execution-authority-contract.test.mjs
          node tests/story-event-runtime-contract.test.mjs
          node tests/story-enter-zone-trigger-contract.test.mjs
          node tests/story-runtime-spawn-combat-effects-contract.test.mjs

      - name: Commit final fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/story-execution-authority.js \
            src/scene-run-start-story.js \
            tests/story-enter-zone-trigger-contract.test.mjs
          git commit -m "Restore Story trigger validation after executor consolidation"
          git push origin HEAD:feature/story-shared-execution-authority
