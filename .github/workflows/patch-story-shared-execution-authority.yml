name: Patch Story Shared Execution Authority

on:
  push:
    branches:
      - feature/story-shared-execution-authority
    paths:
      - .github/workflows/patch-story-shared-execution-authority.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/story-shared-execution-authority

      - name: Apply shared execution integration
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-story-shared-execution-authority.py

      - name: Validate integration
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check src/story-execution-authority.js
          node --check src/story-event-gateway.js
          node --check src/scene-run-start-story.js
          node --check src/story-zone-trigger-gateway.js
          node --check src/runtime-object-story.js
          node --check src/runtime-story-lifecycle.js
          node tests/story-shared-execution-authority-contract.test.mjs

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/story-execution-authority.js \
            src/story-event-gateway.js \
            src/scene-run-start-story.js \
            src/story-zone-trigger-gateway.js \
            src/runtime-object-story.js \
            src/runtime-story-lifecycle.js
          git commit -m "Route Story execution through shared authority"
          git push origin HEAD:feature/story-shared-execution-authority
