name: Patch Scene Transition Integration

on:
  push:
    branches:
      - feature/scene-transition-policy
    paths:
      - .github/workflows/patch-scene-transition.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/scene-transition-policy

      - name: Apply integration patch
        run: python3 scripts/patch-scene-transition.py

      - name: Validate integration
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check src/runtime-object-gateway.js
          node --check src/runtime-scene-transition.js
          node --check public/assets/gm-runtime-map.js
          node --check scripts/production-alpha-scene-transition-e2e.mjs
          node scripts/production-alpha-scene-transition-e2e.mjs
          node tests/runtime-scene-transition-contract.test.mjs

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime-object-gateway.js public/assets/gm-runtime-map.js scripts/production-alpha-e2e.mjs docs/STORY_OBJECT_STATE_MECHANICS_ALPHA.md
          git commit -m "Integrate Runtime Scene transition policy"
          git push origin HEAD:feature/scene-transition-policy
