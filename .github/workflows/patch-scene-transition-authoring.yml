name: Patch Scene Transition Authoring Integration v2

on:
  push:
    branches:
      - feature/scene-transition-authoring
    paths:
      - .github/workflows/patch-scene-transition-authoring.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/scene-transition-authoring

      - name: Apply integration patches
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-scene-transition-definition-safety.py
          python3 scripts/patch-scene-transition-authoring.py

      - name: Validate integration
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check src/runtime-object-gateway.js
          node --check src/scene-transition-definition.js
          node --check public/assets/gm-story.js
          node --check public/assets/gm-runtime-map.js
          node --check scripts/production-alpha-scene-transition-authoring-e2e.mjs
          node scripts/production-alpha-scene-transition-authoring-e2e.mjs
          node tests/scene-transition-definition-contract.test.mjs

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/scene-transition-definition.js \
            src/runtime-object-gateway.js \
            public/assets/gm-story.js \
            public/assets/gm-runtime-map.js \
            scripts/production-alpha-e2e.mjs \
            docs/RUNTIME_SCENE_TRANSITION_POLICY_ALPHA.md
          git commit -m "Integrate Scene transition Definition authoring"
          git push origin HEAD:feature/scene-transition-authoring
