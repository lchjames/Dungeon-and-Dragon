name: Apply Inventory Weapon Integration

on:
  push:
    branches:
      - feature/inventory-weapon-foundation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/inventory-weapon-foundation
      - name: Apply deterministic integration patch
        run: python3 scripts/apply-inventory-weapon-integration.py
      - name: Validate generated integration
        run: |
          git diff --check
          node --check src/inventory-weapon-authority.js
          node --check src/inventory-weapon-gateway.js
          node --check public/assets/gm-inventory-weapons.js
          node --check public/assets/player-inventory-weapons.js
          node --check scripts/production-alpha-inventory-weapon-e2e.mjs
          node tests/inventory-weapon-authority.test.mjs
          node tests/inventory-weapon-foundation-contract.test.mjs
          node tests/deployment-contract.test.mjs
      - name: Commit generated integration
        run: |
          if git diff --quiet -- src/inventory-weapon-authority.js public/gm/index.html public/player/index.html wrangler.jsonc scripts/production-alpha-e2e.mjs tests; then
            echo "No integration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/inventory-weapon-authority.js public/gm/index.html public/player/index.html wrangler.jsonc scripts/production-alpha-e2e.mjs tests
          git commit -m "Integrate Inventory and Weapon foundation"
          git push origin HEAD:feature/inventory-weapon-foundation
