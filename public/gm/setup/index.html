<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Initial GM provisioning for D&D Campaign Hub">
  <title>Initial GM Setup · D&D Campaign Hub</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="stylesheet" href="/assets/auth.css">
  <script type="module" src="/assets/gm-setup.js"></script>
</head>
<body class="auth-body">
  <main class="auth-shell">
    <section class="auth-card">
      <a class="auth-brand" href="/"><span class="brand-dot gm-dot">GM</span><span><strong>D&D Campaign Hub</strong><small>Initial GM Provisioning</small></span></a>

      <div class="auth-copy">
        <p class="eyebrow">ONE-TIME SETUP</p>
        <h1>建立第一個 GM</h1>
        <p>呢個頁面只會將<strong>目前已登入嘅 Player User</strong>升為 <code>gm</code>。一旦 D1 已存在任何 <code>gm</code> 或 <code>admin</code>，bootstrap 就會永久拒絕再次執行。</p>
      </div>

      <form id="gm-provision-form" class="auth-form">
        <label class="field">
          <span>Provisioning Token</span>
          <input id="gm-provision-token" class="input" type="password" autocomplete="off" minlength="24" required placeholder="Cloudflare Secret token">
        </label>
        <p class="muted">Token 必須同 Worker Secret <code>INITIAL_GM_PROVISION_TOKEN</code> 完全一致；token 唔會儲存在瀏覽器或 D1。</p>
        <div id="gm-provision-status" class="auth-status" hidden role="status" aria-live="polite"></div>
        <button id="gm-provision-submit" class="button button-full" type="submit">Provision this User as GM</button>
      </form>

      <div class="auth-links">
        <a href="/player/">返回 Player Workspace</a>
      </div>
    </section>
  </main>
</body>
</html>
